<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffc800">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="화물모의고사">
<title>화물운송 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 차분한 시험장, 격려하는 말투
IDEA: 노란 영업용 번호판 + CBT 시험 단말기
PICTURE: 번호판 헤더, 실제로 움직이는 적성검사 화면
COLOUR and TYPE: 번호판 노랑, 먹색, 흰 바탕 / Noto Sans KR
LAYOUT: 한 칼럼, 휴대폰 우선, 하단 고정 버튼 */
:root{color-scheme:light dark;--bg:light-dark(#fff,#131416);--ink:light-dark(#141414,#f1f1ee);--mute:light-dark(#5d5d5a,#a6a6a0);--line:light-dark(#e2e2dc,#2e3034);--card:light-dark(#f4f4ef,#1c1e21);--y:#ffc800;--yk:#141414;--ok:light-dark(#11804a,#4fd18b);--bad:light-dark(#c62828,#ff6b6b);--stage:light-dark(#e8e8e2,#24262a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.plate{background:var(--y);color:var(--yk);padding:22px max(5vw,16px) 26px}
.plate .in{max-width:720px;margin:0 auto}
.plate h1{font-size:clamp(28px,7vw,40px);line-height:1.1;margin:0 0 8px;font-weight:900;text-wrap:balance}
.plate p{margin:0;font-weight:500}
.badge{display:inline-block;border:2.5px solid var(--yk);border-radius:10px;padding:2px 12px;font-weight:900;font-size:15px;margin-bottom:12px}
.card{background:var(--card);border-radius:16px;padding:18px;margin:14px 0}
.card h2{margin:0 0 4px;font-size:20px;line-height:1.3}
.card p{margin:4px 0 12px;color:var(--mute)}
.st{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;margin-bottom:8px}
.st.ok{background:var(--ok);color:#fff}.st.no{background:var(--line);color:var(--ink)}
button{font:inherit;font-weight:700;font-size:16px;min-height:48px;border-radius:12px;border:0;padding:10px 16px;cursor:pointer;color:var(--ink);background:var(--line)}
button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.pri{background:var(--ink);color:var(--bg)}.yb{background:var(--y);color:var(--yk)}
.ghost{background:transparent;border:1.5px solid var(--line)}
.full{width:100%}.sm{min-height:40px;font-size:14px;padding:6px 12px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.note{font-size:13px;color:var(--mute);margin:18px 0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:14px}
.bar .time{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;margin-right:auto;white-space:nowrap}
.time.low{color:var(--bad)}
.exam{max-width:720px;margin:0 auto;padding:18px 16px 110px}
.chip{display:inline-block;background:var(--y);color:var(--yk);font-weight:700;font-size:13px;padding:2px 10px;border-radius:6px;margin:0 0 10px}
.qn{font-size:19px;line-height:1.5;margin:0 0 18px;font-weight:700}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;min-height:56px;font-weight:500;line-height:1.5}
.opt b{flex:none;font-size:18px}
.opt.on{border-color:var(--yk);background:var(--y);color:var(--yk)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.foot .row{max-width:720px;margin:0 auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:18px}
.nums{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin:12px 0}
.nums button{min-height:40px;padding:0;font-size:14px;background:var(--card)}
.nums button.a{background:var(--y);color:var(--yk)}.nums button.c{outline:2px solid var(--ink)}
.nums .sep{grid-column:1/-1;font-size:13px;color:var(--mute);margin-top:4px}
@media(max-width:420px){.nums{grid-template-columns:repeat(6,minmax(0,1fr))}}
.big{font-size:clamp(44px,12vw,64px);font-weight:900;line-height:1.05;margin:6px 0}
.meter{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:var(--ink)}
.meter i.ok{background:var(--ok)}.meter i.bad{background:var(--bad)}
.sub{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-top:12px}
.sub span:last-child{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.rv{border-top:1px solid var(--line);padding:14px 0}
.rv .q{font-weight:700;margin:0 0 6px}
.rv .me{color:var(--bad)}.rv .ans{color:var(--ok);font-weight:700}
.rv .ex{color:var(--mute);font-size:15px;margin:4px 0 0}
.hist{list-style:none;padding:0;margin:8px 0 0}
.hist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.hist .meter{margin:0}
.stage{position:relative;height:170px;background:var(--stage);border-radius:14px;overflow:hidden;margin:14px 0}
.road{position:absolute;left:0;right:0;bottom:52px;border-top:3px dashed var(--mute);opacity:.5}
.tunnel{position:absolute;left:45%;width:40%;top:28px;bottom:28px;background:#2b2b2b;border-radius:60px 60px 0 0;z-index:2;border:3px solid #444}
.mark{position:absolute;left:85%;top:2px;transform:translateX(-50%);color:var(--bad);font-size:22px;z-index:3;line-height:1}
.stopl{position:absolute;left:80%;top:20px;bottom:20px;width:4px;background:var(--bad);z-index:2}
.truck{position:absolute;left:0;bottom:56px;width:44px;height:26px;background:var(--y);border-radius:4px 12px 4px 4px;z-index:1;will-change:transform;box-shadow:inset -12px 0 0 rgba(0,0,0,.18)}
.truck::after{content:"";position:absolute;left:6px;right:6px;bottom:-8px;height:8px;background:radial-gradient(circle at 6px 4px,#222 4px,transparent 5px),radial-gradient(circle at calc(100% - 6px) 4px,#222 4px,transparent 5px)}
.hint{min-height:28px;text-align:center;font-weight:700;margin:8px 0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo button,.hit{min-height:76px;font-size:20px}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.cell{aspect-ratio:1;border:2px solid var(--line);border-radius:12px;display:grid;place-items:center;font-size:clamp(28px,9vw,44px);font-weight:900;background:var(--bg)}
.cell.cue{border-color:var(--ink)}
.dot{width:64px;height:64px;border-radius:50%;position:absolute;top:50%;transform:translate(-50%,-50%)}
.shapes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--stage);border-radius:14px;padding:14px;margin:14px 0;min-height:240px}
.sh{aspect-ratio:1;display:grid;place-items:center}
.sh i{display:block;width:62%;height:62%}
.sh i.c{border-radius:50%}.sh i.t{clip-path:polygon(50% 0,100% 100%,0 100%)}
.r{color:var(--ok);font-weight:700}.x{color:var(--bad);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
td:last-child,th:last-child{text-align:right;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<div id="app"></div>
<script>
{
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('fx2_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('fx2_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('fx2_'+k)}catch(e){}}};
const SUBJ=[{k:'L',s:'법규',n:'교통 및 화물자동차 운수사업 관련 법규',c:25},{k:'S',s:'안전운행',n:'안전운행',c:25},{k:'C',s:'화물취급요령',n:'화물취급요령',c:15},{k:'V',s:'운송서비스',n:'운송서비스',c:15}];
const RAW={L:`
도로교통법상 '자동차전용도로'의 뜻으로 옳은 것은?|자동차만 다닐 수 있도록 설치된 도로|고속도로와 일반도로를 연결하는 도로|화물자동차만 통행할 수 있는 도로|보행자와 자동차가 함께 다니는 도로|자동차전용도로는 자동차만 다닐 수 있도록 설치된 도로입니다.
화물자동차 운수사업의 종류가 아닌 것은?|화물자동차 대여사업|화물자동차 운송사업|화물자동차 운송주선사업|화물자동차 운송가맹사업|운수사업은 운송사업, 운송주선사업, 운송가맹사업 세 가지입니다.
현행 화물자동차 운송사업의 종류로 옳은 것은?|일반화물자동차 운송사업, 개인화물자동차 운송사업|일반·용달·개별화물자동차 운송사업|일반·택배화물자동차 운송사업|법인·개인·용달화물자동차 운송사업|제도 개편으로 일반과 개인 두 종류로 정리되었습니다.
편도 3차로 이상 고속도로에서 화물자동차가 통행할 차로는?|오른쪽 차로|왼쪽 차로|1차로|모든 차로를 자유롭게|왼쪽 차로는 승용·경형·소형·중형 승합, 오른쪽 차로는 대형 승합·화물·특수·건설기계가 통행합니다.
황색 등화의 점멸이 뜻하는 것은?|다른 교통 또는 안전표지에 주의하면서 진행할 수 있다|정지선 직전에 일시정지한 후 진행한다|진행할 수 없다|우회전만 할 수 있다|황색 점멸은 주의하며 진행, 적색 점멸은 일시정지 후 진행입니다.
적색 등화의 점멸이 뜻하는 것은?|정지선이나 횡단보도 직전에 일시정지한 후 다른 교통에 주의하면서 진행할 수 있다|주의하면서 서행으로 진행할 수 있다|절대 진행할 수 없다|좌회전만 할 수 있다|적색 점멸은 반드시 일시정지한 뒤 주의하며 진행합니다.
도로교통법상 서행해야 할 장소가 아닌 것은?|교통정리를 하고 있는 교차로|도로가 구부러진 부근|비탈길의 고갯마루 부근|가파른 비탈길의 내리막|서행 장소는 '교통정리를 하고 있지 않은' 교차로입니다.
도로교통법상 일시정지해야 할 장소는?|교통정리가 없고 좌우를 확인할 수 없거나 교통이 빈번한 교차로|도로가 구부러진 부근|비탈길의 고갯마루 부근|가파른 비탈길의 내리막|나머지 보기는 서행해야 할 장소입니다.
앞지르기 금지 장소가 아닌 것은?|편도 2차로 직선 도로|교차로|터널 안|다리 위|교차로, 터널 안, 다리 위, 구부러진 곳, 비탈길 고갯마루 부근 등은 앞지르기 금지 장소입니다.
교차로의 가장자리나 도로의 모퉁이로부터 몇 m 이내에 정차·주차가 금지되는가?|5m|3m|10m|15m|교차로 가장자리·도로 모퉁이로부터 5m 이내는 정차·주차 금지입니다.
횡단보도로부터 몇 m 이내에 정차·주차가 금지되는가?|10m|5m|3m|20m|횡단보도로부터 10m 이내는 정차·주차 금지입니다.
도로교통법상 주차금지 장소에 해당하는 것은?|터널 안 및 다리 위|노상주차장의 주차구획 안|편도 3차로 도로의 주차 허용 구역|일방통행로의 주차구획 안|터널 안과 다리 위는 주차금지 장소입니다.
제1종 보통면허로 운전할 수 있는 화물자동차는?|적재중량 12톤 미만의 화물자동차|적재중량 12톤 이상의 화물자동차|모든 특수자동차|대형 견인차|1종 보통면허는 적재중량 12톤 미만 화물자동차를 운전할 수 있습니다.
제2종 보통면허로 운전할 수 있는 화물자동차는?|적재중량 4톤 이하의 화물자동차|적재중량 12톤 미만의 화물자동차|적재중량 5톤 이하의 화물자동차|적재중량 1톤 이하의 화물자동차만|2종 보통면허는 적재중량 4톤 이하 화물자동차까지 가능합니다.
운전이 금지되는 술에 취한 상태의 기준은?|혈중알코올농도 0.03% 이상|혈중알코올농도 0.05% 이상|혈중알코올농도 0.08% 이상|혈중알코올농도 0.1% 이상|혈중알코올농도 0.03% 이상이면 술에 취한 상태입니다.
1년간 누산 벌점이 몇 점 이상이면 운전면허가 취소되는가?|121점|101점|150점|201점|1년 121점, 2년 201점, 3년 271점 이상이면 취소됩니다.
화물이 인도기한이 지난 후 몇 개월 이내에 인도되지 않으면 멸실된 것으로 보는가?|3개월|1개월|6개월|1년|인도기한 경과 후 3개월 이내 인도되지 않으면 멸실로 봅니다.
적재물배상책임보험은 사고 건당 얼마 이상을 보상하도록 가입해야 하는가?|2천만원|1천만원|5천만원|1억원|사고 건당 2천만원 이상입니다.
적재물배상책임보험 의무 가입 대상 화물자동차의 최대적재량 기준은?|5톤 이상|1톤 이상|2.5톤 이상|10톤 이상|최대적재량 5톤 이상(또는 총중량 10톤 이상)인 일반형·밴형·특수용도형 화물자동차가 대상입니다.
화물자동차 규모별 '소형'의 기준은?|최대적재량 1톤 이하이고 총중량 3.5톤 이하|최대적재량 0.5톤 이하|최대적재량 1톤 초과 5톤 미만|최대적재량 5톤 이상|소형은 최대적재량 1톤 이하, 총중량 3.5톤 이하입니다.
화물자동차 규모별 '대형'의 기준은?|최대적재량 5톤 이상이거나 총중량 10톤 이상|최대적재량 1톤 이상|총중량 3.5톤 이상|최대적재량 12톤 이상|대형은 최대적재량 5톤 이상 또는 총중량 10톤 이상입니다.

const APT=[
 {n:'속도예측',d:'트럭이 일정한 속도로 오다가 터널 속으로 사라져요. 트럭이 빨간 ▼ 표시(터널 끝)에 닿았다고 생각할 때 "지금!"을 누르세요. 터널에 들어가기 전에 누르면 0점이에요.',run:speedTest},
 {n:'정지거리예측',d:'트럭이 달려와요. "브레이크"를 누르면 미끄러지면서 서서히 멈춰요. 트럭 앞부분이 빨간 정지선에 딱 맞게 멈추도록 미리 누르세요. 한 번만 누를 수 있어요.',run:stopTest},
 {n:'주의전환',d:'칸 하나에 # 표시가 잠깐 나타난 뒤 화살표가 나와요. 보통 # 자리에 나오지만 다른 칸에 나올 때도 있어요. 화살표 방향대로 왼쪽/오른쪽 버튼을 최대한 빨리 누르세요.',run:switchTest},
 {n:'반응조절',d:'화면 왼쪽이나 오른쪽에 빨간 원 또는 초록 원이 나와요. 위치는 신경 쓰지 말고 색깔에 맞는 버튼(빨강/초록)을 최대한 빨리 누르세요.',run:colorTest},

];

function setProg(a,b){const p=document.getElementById('prog');if(p)p.textContent=a+'/'+b}

function speedTest(el,done){
  const N=6,sc=[];let t=0;
  el.innerHTML=`<div class="stage" id="stg"><div class="road"></div><div class="tunnel"></div><div class="mark">▼</div><div class="truck" id="trk"></div></div><p class="hint" id="hint">준비…</p><button class="hit pri full" id="hit">지금!</button>`;
  const stg=el.querySelector('#stg'),trk=el.querySelector('#trk'),hint=el.querySelector('#hint'),hit=el.querySelector('#hit');
  let st={};
  function next(){
    if(t>=N)return done(avg(sc));
    setProg(t+1,N);hint.textContent='트럭을 잘 보세요';
    const W=stg.clientWidth,v=W*(0.16+Math.random()*0.2),x0=-50;
    st={W,v,x0,enter:(W*0.45-44-x0)/v,target:(W*0.85-22-x0)/v,t0:performance.now(),on:true};
    trk.style.transform=`translateX(${x0}px)`;
    const loop=now=>{const s=(now-st.t0)/1000;trk.style.transform=`translateX(${x0+v*s}px)`;
      if(st.on&&s>st.target+(st.target-st.enter)*1.2){finish(null)}
      if(x0+v*s<W+60)rafId=requestAnimationFrame(loop)};
    rafId=requestAnimationFrame(loop);
  }
  function finish(s){
    if(!st.on)return;st.on=false;let p;
    if(s===null){p=0;hint.innerHTML='<span class="x">시간 초과</span>'}
    else if(s<st.enter){p=0;hint.innerHTML='<span class="x">너무 빨리 눌렀어요</span>'}
    else{const d=s-st.target;p=clamp(100-200*Math.abs(d)/(st.target-st.enter),0,100);hint.innerHTML=`${Math.abs(d).toFixed(2)}초 ${d<0?'빠름':'늦음'} · <b>${Math.round(p)}점</b>`}
    sc.push(p);t++;later(()=>{cancelAnimationFrame(rafId);next()},1400);
  }
  hit.onclick=()=>{if(st.on)finish((performance.now()-st.t0)/1000)};
  later(next,700);
}
function stopTest(el,done){
  const N=6,sc=[];let t=0;
  el.innerHTML=`<div class="stage" id="stg"><div class="road"></div><div class="stopl"></div><div class="truck" id="trk"></div></div><p class="hint" id="hint">준비…</p><button class="hit pri full" id="hit">브레이크</button>`;
  const stg=el.querySelector('#stg'),trk=el.querySelector('#trk'),hint=el.querySelector('#hint'),hit=el.querySelector('#hit');
  let st={};
  function next(){
    if(t>=N)return done(avg(sc));
    setProg(t+1,N);hint.textContent='정지선에 맞춰 멈추세요';
    const W=stg.clientWidth,v=W*(0.25+Math.random()*0.2),a=0.30625*W;
    st={W,v,a,x:-50,vel:v,brake:false,on:true,last:performance.now(),line:W*0.8};
    const loop=now=>{const dt=Math.min(0.05,(now-st.last)/1000);st.last=now;
      if(st.brake){st.vel=Math.max(0,st.vel-st.a*dt)}
      st.x+=st.vel*dt;trk.style.transform=`translateX(${st.x}px)`;
      if(st.brake&&st.vel===0){return finish()}
      if(!st.brake&&st.x+44>st.line+W*0.15){return finish(true)}
      rafId=requestAnimationFrame(loop)};
    rafId=requestAnimationFrame(loop);
  }
  function finish(miss){
    if(!st.on)return;st.on=false;let p;
    if(miss){p=0;hint.innerHTML='<span class="x">브레이크를 안 밟았어요</span>'}
    else{const e=(st.x+44-st.line)/st.W;p=clamp(100-Math.abs(e)/0.12*100,0,100);hint.innerHTML=`${e<0?'정지선 앞':'정지선 넘음'} · <b>${Math.round(p)}점</b>`}
    sc.push(p);t++;later(next,1500);
  }
  hit.onclick=()=>{if(st.on&&!st.brake){st.brake=true;hint.textContent='제동 중…'}};
  later(next,700);
}
function rtTest(el,done,opt){
  const N=14,sc=[];let t=0,st={};
  el.innerHTML=opt.html+`<p class="hint" id="hint"></p><div class="duo"><button id="b0" class="${opt.c0}">${opt.l0}</button><button id="b1" class="${opt.c1}">${opt.l1}</button></div>`;
  const hint=el.querySelector('#hint');
  function next(){
    if(t>=N)return done(avg(sc));
    setProg(t+1,N);opt.clear(el);st={on:false};
    later(()=>{opt.pre(el,st);later(()=>{opt.show(el,st);st.t0=performance.now();st.on=true;later(()=>{if(st.on)res(-1)},2200)},opt.preMs)},500+Math.random()*500);
  }
  function res(b){
    if(!st.on)return;st.on=false;let p=0;const rt=performance.now()-st.t0;
    if(b===-1)hint.innerHTML='<span class="x">시간 초과</span>';
    else if(b!==st.ans)hint.innerHTML='<span class="x">틀렸어요</span>';
    else{p=clamp(100-(rt-450)/opt.k,0,100);hint.innerHTML=`${Math.round(rt)}ms · <b>${Math.round(p)}점</b>`}
    sc.push(p);t++;opt.clear(el);later(next,700);
  }
  el.querySelector('#b0').onclick=()=>res(0);el.querySelector('#b1').onclick=()=>res(1);
  later(next,500);
}
function switchTest(el,done){
  rtTest(el,done,{html:`<div class="cells">${Array.from({length:8},(_,i)=>`<div class="cell" id="c${i}"></div>`).join('')}</div>`,l0:'◀ 왼쪽',l1:'오른쪽 ▶',c0:'pri',c1:'pri',k:7,preMs:450,
   clear(el){for(let i=0;i<8;i++){const c=el.querySelector('#c'+i);c.textContent='';c.classList.remove('cue')}},
   pre(el,st){st.cue=Math.random()*8|0;const c=el.querySelector('#c'+st.cue);c.textContent='#';c.classList.add('cue')},
   show(el,st){let pos=st.cue;if(Math.random()<0.25){do{pos=Math.random()*8|0}while(pos===st.cue)}
     this.clear(el);st.ans=Math.random()<0.5?0:1;el.querySelector('#c'+pos).textContent=st.ans?'→':'←'}});
}
function colorTest(el,done){
  rtTest(el,done,{html:`<div class="stage" id="cs"></div>`,l0:'빨강',l1:'초록',c0:'',c1:'',k:9,preMs:300,
   clear(el){el.querySelector('#cs').innerHTML='';el.querySelector('#b0').style.background='#d32f2f';el.querySelector('#b0').style.color='#fff';el.querySelector('#b1').style.background='#1b8a4b';el.querySelector('#b1').style.color='#fff'},
   pre(){},
   show(el,st){st.ans=Math.random()<0.5?0:1;const left=Math.random()<0.5;el.querySelector('#cs').innerHTML=`<div class="dot" style="left:${left?25:75}%;background:${st.ans?'#1b8a4b':'#d32f2f'}"></div>`}});
}
function changeTest(el,done){
  const N=10,COL=['#d32f2f','#1f5fd6','#1b8a4b','#ffc800'],SH=['c','s','t'];let t=0,ok=0,st={};
  el.innerHTML=`<div class="shapes" id="sg"></div><p class="hint" id="hint"></p><div class="duo"><button id="b0" class="pri">같다</button><button id="b1" class="pri">다르다</button></div>`;
  const sg=el.querySelector('#sg'),hint=el.querySelector('#hint');
  const draw=cells=>{sg.innerHTML=Array.from({length:9},(_,i)=>{const c=cells[i];return `<div class="sh">${c?`<i class="${c.s}" style="background:${c.c}"></i>`:''}</div>`}).join('')};
  function next(){
    if(t>=N)return done(clamp((ok/N-0.5)*200,0,100));
    setProg(t+1,N);hint.textContent='잘 기억하세요';st={on:false};
    const n=4+(Math.random()*3|0),pos=shuffle([0,1,2,3,4,5,6,7,8]).slice(0,n),cells={};
    pos.forEach(p=>cells[p]={s:SH[Math.random()*3|0],c:COL[Math.random()*4|0]});
    draw(cells);
    later(()=>{draw({});hint.textContent='…';later(()=>{
      st.ans=Math.random()<0.5?1:0;const c2=JSON.parse(JSON.stringify(cells));
      if(st.ans){const p=pos[Math.random()*n|0];if(Math.random()<0.5){c2[p].s=SH[(SH.indexOf(c2[p].s)+1+(Math.random()*2|0))%3]}else{c2[p].c=COL[(COL.indexOf(c2[p].c)+1+(Math.random()*3|0))%4]}}
      draw(c2);hint.textContent='처음과 같나요?';st.on=true},900)},1500);
  }
  function res(b){if(!st.on)return;st.on=false;const r=b===st.ans;if(r)ok++;hint.innerHTML=r?'<span class="r">정답</span>':'<span class="x">오답</span>';t++;later(next,900)}
  el.querySelector('#b0').onclick=()=>res(0);el.querySelector('#b1').onclick=()=>res(1);
  later(next,500);
}

/* ---------- EXAM ---------- */
function newExam(){
  const seen=store.get('seen',{});let items=[];
  for(const s of SUBJ){items=items.concat(shuffle(POOL.filter(q=>q.sub===s.k)).sort((x,y)=>(seen[x.id]||0)-(seen[y.id]||0)).slice(0,s.c))}
  return mk(items,'full',80);
}
function mk(items,mode,min){
  items=items.map(q=>{const opts=shuffle([q.a,...q.w]);return {id:q.id,sub:q.sub,q:q.q,ex:q.ex,opts,ans:opts.indexOf(q.a)}});
  return {items,pick:Array(items.length).fill(-1),cur:0,end:Date.now()+min*60000,mode};
}
function save(){if(exam&&exam.mode==='full')store.set('cur',exam)}
function examView(){
  const e=exam,q=e.items[e.cur],s=SUBJ.find(x=>x.k===q.sub),n=e.items.length,done=e.pick.filter(x=>x>=0).length;
  clearAll();
  app.innerHTML=`<div class="bar"><span class="time" id="time"></span><span>${done}/${n}</span><button class="ghost sm" data-act="grid">문제 목록</button></div>
  <main class="exam"><span class="chip">${esc(s.s)}</span><h2 class="qn">${e.cur+1}. ${esc(q.q)}</h2>
  <ol class="opts">${q.opts.map((o,i)=>`<li><button class="opt${e.pick[e.cur]===i?' on':''}" data-opt="${i}"><b>${'①②③④'[i]}</b><span>${esc(o)}</span></button></li>`).join('')}</ol></main>
  <nav class="foot"><div class="row"><button class="ghost" data-act="prev" ${e.cur===0?'disabled':''}>이전</button>${e.cur<n-1?'<button class="pri" data-act="next">다음</button>':'<button class="yb" data-act="ask">답안 제출</button>'}</div></nav>`;
  const tm=()=>{const left=Math.max(0,e.end-Date.now()),m=Math.floor(left/60000),sec=Math.floor(left/1000)%60,el=document.getElementById('time');
    if(el){el.textContent=`남은 시간 ${m}:${String(sec).padStart(2,'0')}`;el.classList.toggle('low',left<300000)}
    if(left<=0){submit()}};
  tm();tick=setInterval(tm,1000);
}
function grid(){
  const e=exam;let html='',last='';
  e.items.forEach((q,i)=>{if(q.sub!==last){last=q.sub;html+=`<span class="sep">${esc(SUBJ.find(s=>s.k===q.sub).s)}</span>`}html+=`<button class="${e.pick[i]>=0?'a':''} ${i===e.cur?'c':''}" data-go="${i}">${i+1}</button>`});
  modal(`<h3>문제 목록</h3><p class="note" style="margin:0">노란 칸은 답한 문제예요.</p><div class="nums">${html}</div><div class="row"><button class="ghost" data-act="close">닫기</button><button class="yb" data-act="ask">답안 제출</button></div>`);
}
function modal(h){const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="sheet">${h}</div>`;document.body.appendChild(m)}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove()}
function ask(){closeModal();const left=exam.pick.filter(x=>x<0).length;modal(`<h3>답안을 제출할까요?</h3><p>${left?`아직 안 푼 문제가 <b>${left}개</b> 있어요.`:'모든 문제에 답했어요.'} 제출하면 바로 채점돼요.</p><div class="row"><button class="ghost" data-act="close">계속 풀기</button><button class="yb" data-act="submit">제출</button></div>`)}
function submit(){
  closeModal();clearAll();const e=exam;
  const per={};SUBJ.forEach(s=>per[s.k]={ok:0,n:0});let score=0;
  e.items.forEach((q,i)=>{per[q.sub].n++;if(e.pick[i]===q.ans){per[q.sub].ok++;score++}});
  const n=e.items.length,pass=score>=Math.ceil(n*0.6);
  if(e.mode==='full'){
    const seen=store.get('seen',{});e.items.forEach(q=>seen[q.id]=(seen[q.id]||0)+1);store.set('seen',seen);
    const h=store.get('hist',[]);const d=new Date();h.push({d:`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`,score,pass});store.set('hist',h.slice(-30));store.del('cur');
  }
  const wrong=e.items.map((q,i)=>({q,me:e.pick[i]})).filter(x=>x.me!==x.q.ans);
  e.wrong=wrong.map(x=>x.q);
  view(`<header class="plate"><div class="in"><span class="badge">${e.mode==='full'?'모의고사 결과':'오답 다시 풀기 결과'}</span><div class="big">${score}<span style="font-size:.45em"> / ${n}</span></div><h1 style="font-size:28px">${pass?'합격이에요!':'불합격이에요'}</h1><p>${e.mode==='full'?'48문제 이상 맞히면 합격':'60% 이상이면 통과'}</p></div></header>
  <div class="wrap"><section class="card"><h2>과목별 점수</h2>${SUBJ.filter(s=>per[s.k].n).map(s=>`<div class="sub"><span>${esc(s.n)}</span><span>${per[s.k].ok}/${per[s.k].n}</span></div><div class="meter"><i style="width:${per[s.k].ok/per[s.k].n*100}%"></i></div>`).join('')}</section>
  <div class="row">${wrong.length?'<button class="yb" data-act="retry">틀린 문제 다시 풀기</button>':''}<button class="pri" data-act="exam">새 모의고사</button></div>
  <button class="ghost full" data-act="home" style="margin-top:10px">처음으로</button>
  <section style="margin-top:22px"><h2 style="font-size:20px">${wrong.length?`틀린 문제 ${wrong.length}개 해설`:'모두 맞혔어요!'}</h2>
  ${wrong.map(x=>`<div class="rv"><p class="q">${esc(x.q.q)}</p><p class="me" style="margin:0">내 답: ${x.me>=0?esc(x.q.opts[x.me]):'안 풂'}</p><p class="ans" style="margin:0">정답: ${esc(x.q.opts[x.q.ans])}</p><p class="ex">${esc(x.q.ex)}</p></div>`).join('')}</section></div>`);
}

/* ---------- EVENTS ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.opt!==undefined&&exam){exam.pick[exam.cur]=+b.dataset.opt;save();for(const o of document.querySelectorAll('.opt'))o.classList.toggle('on',o===b);const n=exam.pick.filter(x=>x>=0).length;const sp=document.querySelector('.bar span:nth-child(2)');if(sp)sp.textContent=n+'/'+exam.items.length;return}
  if(b.dataset.go!==undefined){exam.cur=+b.dataset.go;closeModal();save();examView();return}
  const a=b.dataset.act;if(!a)return;
  const ap=store.get('apt',null);
  switch(a){
    case 'home':closeModal();exam=null;home();break;
    case 'apt':aptStart();break;
    case 'aptgo':aptRun();break;
    case 'aptnext':aptIntro();break;
    case 'exam':if(!(ap&&ap.pass)){home();break}exam=newExam();save();examView();break;
    case 'resume':exam=store.get('cur',null);if(exam){if(exam.end<Date.now())exam.end=Date.now()+60000;examView()}else home();break;
    case 'retry':{const w=exam.wrong;exam=mk(w.map(q=>POOL.find(p=>p.id===q.id)),'retry',Math.max(5,w.length));examView();break}
    case 'prev':exam.cur--;save();examView();break;
    case 'next':exam.cur++;save();examView();break;
    case 'grid':grid();break;
    case 'close':closeModal();break;
    case 'ask':ask();break;
    case 'submit':submit();break;
    case 'copy':{const done=t=>{b.textContent=t;setTimeout(()=>b.textContent='링크 복사',2000)};const fb=()=>{const ta=document.createElement('textarea');ta.value=LINK;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();done(ok?'복사됐어요!':'위 링크를 길게 눌러 복사하세요')};try{navigator.clipboard.writeText(LINK).then(()=>done('복사됐어요!'),fb)}catch(e){fb()}break}
  }
});
home();
}
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script></body></html>
